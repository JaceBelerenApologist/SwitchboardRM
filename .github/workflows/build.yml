# Builds Switchboard Remote Manager on GitHub's Windows machines.
#
#   push to main      full build with the helper tools bundled. If <Version> in SwitchboardRM.csproj hasn't been
#                     released yet, it publishes the GitHub Release vX.Y.Z (creating the tag) with that version's
#                     CHANGELOG notes; if it has, the build is kept as an artifact only. Bump the version to release.
#   pull request      compile only (quick, no tools)
#   run by hand       full build (tools optional) kept as an artifact; tick "Publish the release" to also release
#                     the current version from this run, if it isn't released yet
#
# Builds of main are code-signed: they run in the "release" environment (limited to main), whose secrets
# SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD hold the code-signing certificate. Other builds aren't signed.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle the helper tools (Session Manager plugin, AWS CLI, ConPTY)
        type: boolean
        default: true
      release:
        description: Publish the release for the current version (if it isn't released yet)
        type: boolean
        default: false

permissions:
  contents: write   # creating the release (and its tag)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # main gets the "release" environment, which holds the signing secrets; nothing else gets an environment
    environment: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'release' || '' }}
    env:
      SIGN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      BUNDLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle) }}
      RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release) }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content SwitchboardRM.csproj -Raw), '<Version>\s*([^<\s]+)\s*</Version>')
          if (-not $m.Success) { throw 'No <Version> in SwitchboardRM.csproj' }
          $v = $m.Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v (bundle tools: $env:BUNDLE, release: $env:RELEASE)"
          if ($env:RELEASE -eq 'true' -and $env:BUNDLE -ne 'true') { throw 'A release needs the tools bundled: tick both boxes' }

      - name: Will this build publish a release?
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release is published when this run may release (main, or a manual run with the box ticked) and the
          # version isn't released yet; such a run keeps no artifact, since the release holds the same files
          $publish = 'false'
          if ($env:RELEASE -eq 'true') {
            gh release view "v${{ steps.version.outputs.version }}" *> $null
            if ($LASTEXITCODE -ne 0) { $publish = 'true' }
            else { Write-Host "Version ${{ steps.version.outputs.version }} is already released: this build is kept as an artifact only" }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Publishes a release: $publish"
          exit 0

      # ---- helper tools: installed fresh, then collected with their licences
      - name: Install the helper tools
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: |
          # Microsoft sign-in is built into Switchboard; these are the tools it still bundles
          $plugin = Join-Path $env:ProgramFiles 'Amazon\SessionManagerPlugin\bin\session-manager-plugin.exe'
          if (-not (Get-Command session-manager-plugin -ErrorAction SilentlyContinue) -and -not (Test-Path $plugin)) {
            Invoke-WebRequest 'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/windows/SessionManagerPluginSetup.exe' -OutFile smp-setup.exe
            Start-Process .\smp-setup.exe -ArgumentList '/quiet' -Wait
          }
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Start-Process msiexec.exe -ArgumentList '/i', 'https://awscli.amazonaws.com/AWSCLIV2.msi', '/qn' -Wait
          }

      - name: Collect the helper tools (with licences and notices)
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: ./collect-tools.ps1

      # ---- the app
      - name: Publish
        shell: pwsh
        run: dotnet publish SwitchboardRM.csproj -c Release

      - name: Sign SwitchboardRM.exe
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw 'The release environment has no SIGNING_PFX_BASE64 / SIGNING_PFX_PASSWORD secret: a build of main is not published unsigned'
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe wasn't found on the build machine" }

          $exe = Resolve-Path 'output\SwitchboardRM.exe'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            # SHA-256, timestamped so the signature stays valid after the certificate expires (two servers, in case one is down)
            $signed = $false
            foreach ($ts in 'http://timestamp.digicert.com', 'http://timestamp.sectigo.com') {
              & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd sha256 /tr $ts /td sha256 /d 'Switchboard Remote Manager' $exe
              if ($LASTEXITCODE -eq 0) { $signed = $true; break }
              Write-Warning "Signing with timestamp server $ts failed; trying the next"
            }
            if (-not $signed) { throw 'Signing SwitchboardRM.exe failed' }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

          # the internal CA isn't trusted on GitHub's machines, so check what can be checked here: signed, by whom, timestamped
          $sig = Get-AuthenticodeSignature $exe
          if (-not $sig.SignerCertificate) { throw 'SwitchboardRM.exe has no signature after signing' }
          if (-not $sig.TimeStamperCertificate) { throw 'SwitchboardRM.exe was signed without a timestamp' }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"
          Write-Host "Certificate: $($sig.SignerCertificate.Thumbprint), valid until $($sig.SignerCertificate.NotAfter)"
          Write-Host "Timestamped by: $($sig.TimeStamperCertificate.Subject)"

      - name: Check the bundle
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: |
          # the zip must carry the tools next to the .exe, or the release can't connect
          foreach ($p in 'output\SwitchboardRM.exe', 'output\tools\session-manager-plugin\session-manager-plugin.exe',
                         'output\tools\aws-cli\aws.exe', 'output\tools\conpty\conpty.dll', 'output\tools\conpty\OpenConsole.exe',
                         'output\tools\THIRD-PARTY-NOTICES.txt') {
            if (-not (Test-Path $p)) { throw "Missing from the build: $p" }
          }
          # nothing left over from the old Microsoft sign-in
          foreach ($p in 'output\tools\node', 'output\tools\aws-azure-login', 'output\tools\chromium') {
            if (Test-Path $p) { throw "Shouldn't be in the build any more: $p" }
          }
          Write-Host ('Bundle OK: {0:N0} MB' -f ((Get-ChildItem output -Recurse -File | Measure-Object Length -Sum).Sum / 1MB))

      - name: Build the installer
        if: env.BUNDLE == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host 'Installing Inno Setup ...'
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup isn't available on the build machine" }

          $isccArgs = @('/Q', "/DAppVersion=$v")
          $pfx = Join-Path $env:RUNNER_TEMP 'installer-signing.pfx'
          try {
            if ($env:SIGN -eq 'true') {
              # main: sign the setup and its uninstaller with the same certificate as SwitchboardRM.exe
              if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) { throw 'No signing secrets: a build of main is not published unsigned' }
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                          Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $signtool) { throw "signtool.exe wasn't found on the build machine" }
              # Inno Setup's sign command: $q is a quote, $f the file to sign, and a literal $ is written $$
              $password = $env:PFX_PASSWORD.Replace('$', '$$')
              $command = '$q' + $signtool.FullName + '$q sign /f $q' + $pfx + '$q /p $q' + $password + '$q' +
                         ' /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d $qSwitchboard Remote Manager$q $f'
              $isccArgs += '/DSign', "/Ssigntool=$command"
            }
            & $iscc @isccArgs 'installer\SwitchboardRM.iss'
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

          $setup = "installer-output\SwitchboardRM-Setup-$v.exe"
          if (-not (Test-Path $setup)) { throw "The installer wasn't built" }
          if ($env:SIGN -eq 'true') {
            $sig = Get-AuthenticodeSignature $setup
            if (-not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) { throw 'The installer is not signed and timestamped' }
            Write-Host "Installer signed by: $($sig.SignerCertificate.Subject)"
          }
          Write-Host ('Installer: {0} ({1:N0} MB)' -f $setup, ((Get-Item $setup).Length / 1MB))

      - name: Zip output\
        shell: pwsh
        run: Compress-Archive -Path output\* -DestinationPath "SwitchboardRM-${{ steps.version.outputs.version }}.zip"

      - name: Keep the zip with this run
        # a release run doesn't need it (the release has the same files); other builds keep it for a week
        if: steps.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchboardRM-${{ steps.version.outputs.version }}
          path: |
            SwitchboardRM-${{ steps.version.outputs.version }}.zip
            installer-output/SwitchboardRM-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7

      # ---- release: when this version hasn't been released yet
      - name: Publish the GitHub Release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $zip = "SwitchboardRM-$v.zip"
          $setup = "installer-output\SwitchboardRM-Setup-$v.exe"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # never replace a published release with a different build
            Write-Host "::notice::Version $v is already released, so this build is kept as an artifact only. Bump <Version> (and the changelog) to publish a new release."
            exit 0
          }

          # that version's section of CHANGELOG.md as the release notes
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match ('^##\s+' + [regex]::Escape($v) + '(\s|$)')) { $start = $i; break } }
          $notes = New-Object System.Collections.Generic.List[string]
          if ($start -ge 0) { for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^##\s'; $i++) { $notes.Add($lines[$i]) } }
          if ($notes.Count -eq 0) { $notes.Add("Switchboard Remote Manager $v") }
          Set-Content release-notes.md ($notes -join "`n").Trim()

          # creates the tag on this commit too
          gh release create $tag $setup $zip --target $env:GITHUB_SHA --title "SwitchboardRM v$v" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed' }
          Write-Host "::notice::Published release $tag"
