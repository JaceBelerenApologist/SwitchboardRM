# Builds Switchboard Remote Manager on GitHub's Windows machines.
#
#   push to main      full build with the helper tools bundled. If <Version> in SwitchboardRM.csproj hasn't been
#                     released yet, it publishes the GitHub Release vX.Y.Z (creating the tag) with that version's
#                     CHANGELOG notes; if it has, the build is kept as an artifact only. Bump the version to release.
#   pull request      compile only (quick, no tools)
#   run by hand       full build (tools optional) kept as an artifact; tick "Publish the release" to also release
#                     the current version from this run, if it isn't released yet
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle the helper tools (Node.js, aws-azure-login with its Chromium, Session Manager plugin, AWS CLI, ConPTY)
        type: boolean
        default: true
      release:
        description: Publish the release for the current version (if it isn't released yet)
        type: boolean
        default: false

permissions:
  contents: write   # creating the release (and its tag)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      BUNDLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bundle) }}
      RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release) }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content SwitchboardRM.csproj -Raw), '<Version>\s*([^<\s]+)\s*</Version>')
          if (-not $m.Success) { throw 'No <Version> in SwitchboardRM.csproj' }
          $v = $m.Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v (bundle tools: $env:BUNDLE, release: $env:RELEASE)"
          if ($env:RELEASE -eq 'true' -and $env:BUNDLE -ne 'true') { throw 'A release needs the tools bundled: tick both boxes' }

      # ---- helper tools: installed fresh, then collected with their licences
      - name: Set up Node.js
        if: env.BUNDLE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install the helper tools
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: |
          # aws-azure-login's Puppeteer downloads its own Chromium (the only sign-in browser) while installing,
          # unless something tells it to skip: make sure nothing does, then check it really arrived
          Remove-Item Env:PUPPETEER_SKIP_DOWNLOAD, Env:PUPPETEER_SKIP_CHROMIUM_DOWNLOAD, Env:PUPPETEER_EXECUTABLE_PATH -ErrorAction SilentlyContinue
          npm config delete puppeteer_skip_download --location=global 2>&1 | Out-Null
          npm config delete puppeteer_skip_chromium_download --location=global 2>&1 | Out-Null
          npm install -g aws-azure-login --no-fund --no-audit --foreground-scripts
          $puppeteer = Join-Path (npm root -g).Trim() 'aws-azure-login\node_modules\puppeteer'
          $hasChrome = { [bool](Get-ChildItem (Join-Path $puppeteer '.local-chromium') -Recurse -Filter chrome.exe -ErrorAction SilentlyContinue) }
          if (-not (& $hasChrome)) {
            Write-Host "Puppeteer's Chromium didn't arrive with the install; downloading it now"
            Push-Location $puppeteer
            node install.js
            Pop-Location
          }
          if (-not (& $hasChrome)) { throw "Puppeteer's Chromium is missing after installing aws-azure-login: the build would have no sign-in browser" }

          $plugin = Join-Path $env:ProgramFiles 'Amazon\SessionManagerPlugin\bin\session-manager-plugin.exe'
          if (-not (Get-Command session-manager-plugin -ErrorAction SilentlyContinue) -and -not (Test-Path $plugin)) {
            Invoke-WebRequest 'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/windows/SessionManagerPluginSetup.exe' -OutFile smp-setup.exe
            Start-Process .\smp-setup.exe -ArgumentList '/quiet' -Wait
          }
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Start-Process msiexec.exe -ArgumentList '/i', 'https://awscli.amazonaws.com/AWSCLIV2.msi', '/qn' -Wait
          }

      - name: Collect the helper tools (with licences and notices)
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: ./collect-tools.ps1

      # ---- the app
      - name: Publish
        shell: pwsh
        run: dotnet publish SwitchboardRM.csproj -c Release

      - name: Check the bundle
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: |
          # the zip must carry the tools next to the .exe, or the release can't sign in or connect
          foreach ($p in 'output\SwitchboardRM.exe', 'output\tools\node\node.exe', 'output\tools\aws-azure-login',
                         'output\tools\session-manager-plugin', 'output\tools\THIRD-PARTY-NOTICES.txt') {
            if (-not (Test-Path $p)) { throw "Missing from the build: $p" }
          }
          if (-not (Get-ChildItem 'output\tools\aws-azure-login\node_modules\puppeteer\.local-chromium' -Recurse -Filter chrome.exe -ErrorAction SilentlyContinue)) {
            throw "Missing from the build: Puppeteer's Chromium in output\tools\aws-azure-login"
          }
          Write-Host ('Bundle OK: {0:N0} MB' -f ((Get-ChildItem output -Recurse -File | Measure-Object Length -Sum).Sum / 1MB))

      - name: Zip output\
        shell: pwsh
        run: Compress-Archive -Path output\* -DestinationPath "SwitchboardRM-${{ steps.version.outputs.version }}.zip"

      - name: Keep the zip with this run
        uses: actions/upload-artifact@v4
        with:
          name: SwitchboardRM-${{ steps.version.outputs.version }}
          path: SwitchboardRM-${{ steps.version.outputs.version }}.zip

      # ---- release: when this version hasn't been released yet
      - name: Publish the GitHub Release
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $zip = "SwitchboardRM-$v.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # never replace a published release with a different build
            Write-Host "::notice::Version $v is already released, so this build is kept as an artifact only. Bump <Version> (and the changelog) to publish a new release."
            exit 0
          }

          # that version's section of CHANGELOG.md as the release notes
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match ('^##\s+' + [regex]::Escape($v) + '(\s|$)')) { $start = $i; break } }
          $notes = New-Object System.Collections.Generic.List[string]
          if ($start -ge 0) { for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^##\s'; $i++) { $notes.Add($lines[$i]) } }
          if ($notes.Count -eq 0) { $notes.Add("Switchboard Remote Manager $v") }
          Set-Content release-notes.md ($notes -join "`n").Trim()

          # creates the tag on this commit too
          gh release create $tag $zip --target $env:GITHUB_SHA --title "Switchboard Remote Manager $v" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed' }
          Write-Host "::notice::Published release $tag"
