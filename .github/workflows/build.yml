# Builds Switchboard Remote Manager on GitHub's Windows machines.
#   push to main / pull request : compile, and keep the zipped app as a downloadable artifact of the run
#   version tag (v2.15.1 ...)   : full release build with the helper tools bundled, published as a GitHub Release
#   run by hand (Actions tab)   : full build (tools optional), artifact only
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle:
        description: Bundle the helper tools (Node.js, aws-azure-login, Session Manager plugin, AWS CLI)
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the release for a version tag

jobs:
  build:
    runs-on: windows-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      BUNDLE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.bundle) }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content SwitchboardRM.csproj -Raw), '<Version>\s*([^<\s]+)\s*</Version>')
          if (-not $m.Success) { throw 'No <Version> in SwitchboardRM.csproj' }
          $v = $m.Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:IS_RELEASE -eq 'true' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "The tag $env:GITHUB_REF_NAME doesn't match <Version>$v</Version> in SwitchboardRM.csproj"
          }
          Write-Host "Building version $v (bundle tools: $env:BUNDLE)"

      # ---- helper tools (release builds): installed fresh, then collected with their licences
      - name: Set up Node.js
        if: env.BUNDLE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install the helper tools
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: |
          npm install -g aws-azure-login --no-fund --no-audit
          $plugin = Join-Path $env:ProgramFiles 'Amazon\SessionManagerPlugin\bin\session-manager-plugin.exe'
          if (-not (Get-Command session-manager-plugin -ErrorAction SilentlyContinue) -and -not (Test-Path $plugin)) {
            Invoke-WebRequest 'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/windows/SessionManagerPluginSetup.exe' -OutFile smp-setup.exe
            Start-Process .\smp-setup.exe -ArgumentList '/quiet' -Wait
          }
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Start-Process msiexec.exe -ArgumentList '/i', 'https://awscli.amazonaws.com/AWSCLIV2.msi', '/qn' -Wait
          }

      - name: Collect the helper tools (with licences and notices)
        if: env.BUNDLE == 'true'
        shell: pwsh
        run: ./collect-tools.ps1

      # ---- the app
      - name: Publish
        shell: pwsh
        run: dotnet publish SwitchboardRM.csproj -c Release

      - name: Zip output\
        shell: pwsh
        run: Compress-Archive -Path output\* -DestinationPath "SwitchboardRM-${{ steps.version.outputs.version }}.zip"

      - name: Keep the zip with this run
        uses: actions/upload-artifact@v4
        with:
          name: SwitchboardRM-${{ steps.version.outputs.version }}
          path: SwitchboardRM-${{ steps.version.outputs.version }}.zip

      # ---- release (version tags only)
      - name: Publish the GitHub Release
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $zip = "SwitchboardRM-$v.zip"

          # that version's section of CHANGELOG.md as the release notes
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match ('^##\s+' + [regex]::Escape($v) + '(\s|$)')) { $start = $i; break } }
          $notes = New-Object System.Collections.Generic.List[string]
          if ($start -ge 0) { for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^##\s'; $i++) { $notes.Add($lines[$i]) } }
          if ($notes.Count -eq 0) { $notes.Add("Switchboard Remote Manager $v") }
          Set-Content release-notes.md ($notes -join "`n").Trim()

          # already made by hand? then just attach the zip to it
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Switchboard Remote Manager $v" --notes-file release-notes.md
          }
